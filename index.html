<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa dos Pets</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    #map {
      height: 100vh;
      width: 100vw;
    }

    .pet-marker {
      background: none;
      border: none;
    }
    .pet-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid #ff7b00;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      object-fit: cover;
      display: block;
      background-color: #fff;
    }

    #petModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-content h3 {
      margin-bottom: 15px;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
      color: #444;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-cancel {
      background: #e0e0e0;
      color: #333;
    }
    .btn-save {
      background: #ff7b00;
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="petModal">
    <div class="modal-content">
      <h3>🐾 Adicionar Pet</h3>
      <div class="form-group">
        <label for="petName">Nome do pet:</label>
        <input type="text" id="petName" placeholder="Ex: Mingau" />
      </div>
      <div class="form-group">
        <label for="petPhoto">Escolha a foto (JPG, PNG):</label>
        <input type="file" id="petPhoto" accept="image/jpeg, image/png, image/webp" />
      </div>
      <div class="modal-buttons">
        <button class="btn btn-cancel" id="btnCancel">Cancelar</button>
        <button class="btn btn-save" id="btnSave">Salvar Pet</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    // 1. CREDENCIAIS DO SUPABASE
    const SUPABASE_URL = 'https://oskcpmwvlzpzmhfiblry.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9za2Nwd3ZsenB6bWhmaWJscnl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjA1MDAsImV4cCI6MjEwODAzNjUwMH0.aDwC5_yeyA5s5Y1DIoeaw5h9lBT1xmJ0To0_ufuCxuE';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. INICIALIZACAO DO MAPA
    const map = L.map('map').setView([-14.235, -51.925], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function desenharMarcador(nome, fotoUrl, lat, lng) {
      const petIcon = L.divIcon({
        className: 'pet-marker',
        html: `<img src="${fotoUrl}" class="pet-avatar" alt="${nome}" title="${nome}">`,
        iconSize: [44, 44],
        iconAnchor: [22, 22],
        popupAnchor: [0, -22]
      });

      L.marker([lat, lng], { icon: petIcon })
        .addTo(map)
        .bindPopup(`
          <div style="text-align: center;">
            <b>${nome}</b><br/>
            <img src="${fotoUrl}" style="width: 140px; height: 140px; object-fit: cover; border-radius: 8px; margin-top: 6px;" />
          </div>
        `);
    }

    // 3. CARREGAR OS PETS DA BASE DE DADOS
    async function carregarPets() {
      const { data, error } = await db.from('pets').select('*');
      if (error) {
        console.error('Erro ao procurar pets:', error);
        return;
      }
      data.forEach(pet => {
        desenharMarcador(pet.name, pet.photo_url, pet.lat, pet.lng);
      });
    }

    carregarPets();

    // 4. EVENTO DE CLIQUE E ENVIO
    let clickedCoords = null;
    const modal = document.getElementById('petModal');
    const petNameInput = document.getElementById('petName');
    const petPhotoInput = document.getElementById('petPhoto');
    const btnCancel = document.getElementById('btnCancel');
    const btnSave = document.getElementById('btnSave');

    map.on('click', function(e) {
      clickedCoords = e.latlng;
      petNameInput.value = '';
      petPhotoInput.value = '';
      modal.style.display = 'flex';
    });

    btnCancel.addEventListener('click', function() {
      modal.style.display = 'none';
      clickedCoords = null;
    });

    btnSave.addEventListener('click', async function() {
      const name = petNameInput.value.trim() || 'Meu Pet';
      const file = petPhotoInput.files[0];

      if (!file) {
        alert('Por favor, selecione uma foto!');
        return;
      }

      btnSave.innerText = 'A enviar...';
      btnSave.disabled = true;

      try {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
        
        const { error: uploadError } = await db.storage
          .from('fotos-pets')
          .upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: publicUrlData } = db.storage
          .from('fotos-pets')
          .getPublicUrl(fileName);

        const photoUrl = publicUrlData.publicUrl;

        const { error: insertError } = await db.from('pets').insert([
          {
            name: name,
            photo_url: photoUrl,
            lat: clickedCoords.lat,
            lng: clickedCoords.lng
          }
        ]);

        if (insertError) throw insertError;

        desenharMarcador(name, photoUrl, clickedCoords.lat, clickedCoords.lng);
        modal.style.display = 'none';
      } catch (err) {
        alert('Erro ao guardar pet: ' + err.message);
      } finally {
        btnSave.innerText = 'Salvar Pet';
        btnSave.disabled = false;
      }
    });
  </script>
</body>
</html>
